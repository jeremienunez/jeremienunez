@keyframes gm{0%{transform:translate(1px,0)}24%{transform:translate(5px,-1px)}25%{transform:translate(-3px,0)}26.5%{transform:translate(1px,0)}74%{transform:translate(6px,0)}75.5%{transform:translate(1px,0)}}
.ab{mix-blend-mode:screen}
