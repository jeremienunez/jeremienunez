<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" xml:space="preserve"><g clip-path="url(#tc)"><use href="#ttl" class="gc ab" fill="#00F0FF" opacity=".75"/><use href="#ttl" class="gm ab" fill="#FF2BD6" opacity=".75"/><use href="#ttl" fill="url(#chrome)"/></g><text x="40.0" y="135.0" font-size="15" textLength="504.0" lengthAdjust="spacing" fill="#E6ECFF" clip-path="url(#c1)">I believe the way we interact with software is changing.</text><rect x="40.0" y="122.7" width="8.1" height="15.0" fill="#C6FF00" opacity="0"><set attributeName="opacity" to="1" begin="0.850s" dur="0.768s"/><animate attributeName="x" from="40.0" to="544.0" begin="0.850s" dur="0.768s" fill="freeze"/></rect><text x="40.0" y="172.0" font-size="15" textLength="630.0" lengthAdjust="spacing" fill="#E6ECFF" clip-path="url(#c2)">Typing, clicking, and navigating menus are not always the most natural</text><rect x="40.0" y="159.7" width="8.1" height="15.0" fill="#C6FF00" opacity="0"><set attributeName="opacity" to="1" begin="1.818s" dur="0.950s"/><animate attributeName="x" from="40.0" to="670.0" begin="1.818s" dur="0.950s" fill="freeze"/></rect><text x="40.0" y="197.0" font-size="15" textLength="207.0" lengthAdjust="spacing" fill="#E6ECFF" clip-path="url(#c3)">ways to use technology.</text><rect x="40.0" y="184.7" width="8.1" height="15.0" fill="#C6FF00" opacity="0"><set attributeName="opacity" to="1" begin="2.768s" dur="0.339s"/><animate attributeName="x" from="40.0" to="247.0" begin="2.768s" dur="0.339s" fill="freeze"/></rect><text x="40.0" y="234.0" font-size="15" textLength="639.0" lengthAdjust="spacing" fill="#E6ECFF" clip-path="url(#c4)">That is why I am interested in voice interfaces, conversational agents,</text><rect x="40.0" y="221.7" width="8.1" height="15.0" fill="#C6FF00" opacity="0"><set attributeName="opacity" to="1" begin="3.307s" dur="0.963s"/><animate attributeName="x" from="40.0" to="679.0" begin="3.307s" dur="0.963s" fill="freeze"/></rect><text x="40.0" y="259.0" font-size="15" textLength="450.0" lengthAdjust="spacing" fill="#E6ECFF" clip-path="url(#c5)">and systems that feel closer to human interaction.</text><rect x="40.0" y="246.7" width="8.1" height="15.0" fill="#C6FF00" opacity="0"><set attributeName="opacity" to="1" begin="4.270s" dur="0.690s"/><animate attributeName="x" from="40.0" to="490.0" begin="4.270s" dur="0.690s" fill="freeze"/></rect><text x="40.0" y="296.0" font-size="15" textLength="414.0" lengthAdjust="spacing" fill="#C6FF00" clip-path="url(#c6)">The future of software may not only be visual.</text><rect x="40.0" y="283.7" width="8.1" height="15.0" fill="#C6FF00" opacity="0"><set attributeName="opacity" to="1" begin="5.160s" dur="0.638s"/><animate attributeName="x" from="40.0" to="454.0" begin="5.160s" dur="0.638s" fill="freeze"/></rect><text x="40.0" y="321.0" font-size="15" textLength="486.0" lengthAdjust="spacing" fill="#C6FF00" clip-path="url(#c7)">It may be conversational, adaptive, and context-aware.</text><rect x="40.0" y="308.7" width="8.1" height="15.0" fill="#C6FF00" opacity="0"><set attributeName="opacity" to="1" begin="5.998s" dur="0.742s"/><animate attributeName="x" from="40.0" to="526.0" begin="5.998s" dur="0.742s" fill="freeze"/></rect><rect x="529.0" y="308.7" width="8.1" height="15.0" fill="#C6FF00" opacity="0"><set attributeName="opacity" to="1" begin="6.940s" fill="freeze"/><animate attributeName="opacity" values="1;0" calcMode="discrete" begin="6.940s" dur="0.8889s" repeatCount="indefinite"/></rect></g>
