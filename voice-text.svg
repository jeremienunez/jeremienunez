<stop offset="0" stop-color="#2D5BFF"/><stop offset=".25" stop-color="#00F0FF"/><stop offset=".5" stop-color="#C6FF00"/><stop offset=".75" stop-color="#FF2BD6"/><stop offset="1" stop-color="#2D5BFF"/>
